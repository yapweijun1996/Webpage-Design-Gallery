<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font: 1rem/1.5 system-ui, sans-serif; }
    main {
      box-sizing: border-box;
      max-inline-size: 40rem;
      margin-inline: auto;
      padding: max(2rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
        max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
    }
  </style>
</head>
<body>
  <main>
    <h1>You’re offline</h1>
    <p>This page is unavailable offline. Check your connection and reload to try again.</p>
  </main>
</body>
</html>
