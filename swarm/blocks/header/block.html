<header class="{{scope}}" id="{{id}}">
  <div class="sds-container bar">
    <a class="mark" href="{{homeUrl}}">
      <img src="{{logo}}" width="{{logoWidth}}" height="{{logoHeight}}" alt="{{logoAlt}}" data-i18n-attr="alt:{{id}}.logo">
    </a>
    <nav class="desktop" aria-label="{{navLabel}}" data-i18n-attr="aria-label:{{id}}.nav">
      <a href="{{brandsUrl}}" data-i18n="{{id}}.brands">{{brandsLabel}}</a>
      <a href="{{aboutUrl}}" data-i18n="{{id}}.about">{{aboutLabel}}</a>
      <a href="{{contactUrl}}" data-i18n="{{id}}.contact">{{contactLabel}}</a>
      <a class="sds-btn shop" href="{{shopUrl}}" data-i18n="{{id}}.shop">{{shopLabel}}</a>
    </nav>
    <details class="mobile">
      <summary class="sds-btn"><span data-i18n="{{id}}.menu">{{menuLabel}}</span></summary>
      <nav aria-label="{{navLabel}}" data-i18n-attr="aria-label:{{id}}.nav">
        <a href="{{brandsUrl}}" data-i18n="{{id}}.brands">{{brandsLabel}}</a>
        <a href="{{aboutUrl}}" data-i18n="{{id}}.about">{{aboutLabel}}</a>
        <a href="{{contactUrl}}" data-i18n="{{id}}.contact">{{contactLabel}}</a>
        <a href="{{shopUrl}}" data-i18n="{{id}}.shop">{{shopLabel}}</a>
      </nav>
    </details>
  </div>
</header>
