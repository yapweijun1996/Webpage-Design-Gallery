<section class="{{scope}}" id="{{id}}" aria-labelledby="{{id}}-title">
  <div class="sds-container about-layout">
    <div class="about-copy">
      <h2 id="{{id}}-title" data-i18n="{{id}}.title">{{title}}</h2>
      <p data-i18n="{{id}}.description">{{description}}</p>
      <a class="sds-btn" href="{{linkUrl}}"><span data-i18n="{{id}}.link">{{linkLabel}}</span> <span aria-hidden="true">↗</span></a>
    </div>
    <img src="{{image}}" width="{{imageWidth}}" height="{{imageHeight}}" alt="{{imageAlt}}" loading="lazy" decoding="async" data-i18n-attr="alt:{{id}}.image">
  </div>
</section>
