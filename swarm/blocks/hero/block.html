<section class="{{scope}}" id="{{id}}" aria-labelledby="{{id}}-title">
  <div class="sds-container hero-layout">
    <div class="hero-art">
      <img src="{{image}}" width="{{imageWidth}}" height="{{imageHeight}}" alt="{{imageAlt}}" fetchpriority="high" data-i18n-attr="alt:{{id}}.image">
    </div>
    <div class="hero-copy">
      <p class="eyebrow" data-i18n="{{id}}.eyebrow">{{eyebrow}}</p>
      <h1 id="{{id}}-title" data-i18n="{{id}}.title">{{title}}</h1>
      <p class="intro" data-i18n="{{id}}.description">{{description}}</p>
      <div class="sds-cluster actions">
        <a class="sds-btn primary" href="{{primaryUrl}}" data-i18n="{{id}}.primary">{{primaryLabel}}</a>
        <a class="sds-btn secondary" href="{{secondaryUrl}}" data-i18n="{{id}}.secondary">{{secondaryLabel}}</a>
      </div>
    </div>
  </div>
</section>
