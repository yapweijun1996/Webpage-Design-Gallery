<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swarm - live design</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/ds/tokens.css">
<link rel="stylesheet" href="/ds/themes.css">
<link rel="stylesheet" href="/ds/components.css">
<link rel="stylesheet" href="/channel.css">
<link rel="stylesheet" href="/settings.css">
<link rel="stylesheet" href="/docs.css">
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:grid;grid-template-rows:auto 1fr;background:#0f1115;color:#e8eaf0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
  #top{display:flex;gap:10px;align-items:center;height:44px;padding:0 10px 0 12px;background:#171a21;border-bottom:1px solid #262b36;flex-wrap:nowrap;overflow:hidden;white-space:nowrap;min-width:0}
  #top h1{font-size:14px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px;flex:none}
  #top h1 svg{width:18px;height:18px;color:#8ab4ff}
  #top .chip{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .ibtn{position:relative;flex:none;width:36px;height:36px;min-height:0;padding:0;display:inline-grid;place-items:center;border-radius:8px;border:1px solid transparent;background:transparent;color:#c4c9d6}
  .ibtn:hover{background:#262b36;color:#fff}
  .ibtn[aria-pressed=true]{background:#262b36;color:#8ab4ff}
  .ibtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ibtn .badge{position:absolute;top:3px;right:3px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:#ff6b5e;color:#fff;font:700 10px/15px system-ui,sans-serif;text-align:center;display:none}
  .ibtn .badge.on{display:block}
  #look{position:fixed;top:48px;right:10px;z-index:300;width:min(340px,calc(100vw - 20px));padding:10px 12px;border:1px solid #333a49;border-radius:12px;background:#171a21;box-shadow:0 12px 32px rgba(0,0,0,.55);font:13px/1.45 system-ui,sans-serif;color:#e8eaf0}
  #look[hidden]{display:none}
  #look .lg{display:grid;gap:6px;margin-bottom:10px}#look .lg b{font-size:12px;color:#aab0bf;font-weight:600}
  #look .lg span{display:flex;flex-wrap:wrap;gap:6px}
  #look button{min-height:34px;padding:0 12px;border-radius:8px;border:1px solid #333a49;background:#1f2430;color:#e8eaf0;font:inherit;cursor:pointer}
  #look button[aria-pressed=true]{background:#2a3350;border-color:#8ab4ff;color:#fff}
  #look p{margin:2px 0 0;color:#8b93a7;font-size:12px}#look code{font-size:11px}
  #setdlg{position:fixed;inset:0;z-index:400;background:rgba(5,7,10,.6);display:flex;justify-content:flex-end}
  #setdlg[hidden]{display:none}
  #setdlg .sheet{width:min(520px,100vw);height:100%;background:#13161c;border-left:1px solid #262b36;display:flex;flex-direction:column;box-shadow:-12px 0 32px rgba(0,0,0,.5)}
  #setdlg header{display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 6px 0 14px;border-bottom:1px solid #262b36;flex:none}
  #setroot{flex:1;min-height:0;overflow:auto}
  .links{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  .links line{stroke-width:2;stroke-dasharray:7 5;stroke-linecap:round;animation:linkfade 6.5s ease-out forwards}
  .links circle{animation:linkfade 6.5s ease-out forwards}
  @keyframes linkfade{0%{opacity:0}8%{opacity:.95}70%{opacity:.8}100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.links line,.links circle{animation:none;opacity:.7}}
  body.picking #stage{cursor:crosshair}
  #pickbox{position:fixed;z-index:350;pointer-events:none;border:2px solid #8ab4ff;background:rgba(138,180,255,.14);border-radius:3px}
  #pickbox[hidden]{display:none}
  #pickbox span{position:absolute;left:-2px;top:-22px;padding:1px 7px;border-radius:4px 4px 0 0;background:#8ab4ff;color:#0b0d11;font:700 11px/20px system-ui,sans-serif;white-space:nowrap}
  #askpop{position:fixed;z-index:360;width:min(340px,calc(100vw - 16px));padding:10px;border:1px solid #333a49;border-radius:12px;background:#171a21;box-shadow:0 14px 36px rgba(0,0,0,.6);font:13px/1.45 system-ui,sans-serif;color:#e8eaf0}
  #askpop[hidden]{display:none}
  #askpop .ah{display:flex;align-items:center;gap:8px;margin-bottom:6px}#askpop .ah i{width:10px;height:10px;border-radius:50%;background:var(--c,#8ab4ff);flex:none}
  #askpop .ah b{flex:1;font-size:13px}#askpop .ae{margin-bottom:8px;color:#aab0bf;font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}
  #askpop textarea{width:100%;resize:vertical;min-height:64px;padding:8px;border-radius:8px;border:1px solid #333a49;background:#0f1115;color:#e8eaf0;font:13px/1.45 system-ui,sans-serif}
  #askpop textarea:focus-visible{outline:2px solid #8ab4ff;outline-offset:1px}
  #askpop .ab{display:flex;gap:8px;margin-top:8px}#askpop .ab button{flex:1;min-height:36px;border-radius:8px;border:1px solid #333a49;background:#1f2430;color:#e8eaf0;font:inherit;cursor:pointer}
  #askpop .ab .pri{background:#8ab4ff;border-color:#8ab4ff;color:#0b0d11;font-weight:700}
  #tip{position:fixed;left:0;top:0;z-index:1000;max-width:240px;padding:7px 10px;border-radius:8px;background:#0b0d11;border:1px solid #333a49;color:#e8eaf0;font:12px/1.45 system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.5);pointer-events:none;opacity:0;transition:opacity .12s;white-space:normal}
  #tip.on{opacity:1}#tip b{display:block;margin-bottom:2px;color:#fff;font-size:12px}#tip span{color:#aab0bf}
  @media (max-width:1100px){#top #rtxt{display:none}}
  @media (max-width:860px){#top #rounds{display:none}}
  @media (max-width:640px){#top #model{display:none}#top .ibtn{width:40px;height:40px}}
  @media (max-width:400px){#top h1 span{display:none}#top{gap:8px;padding:0 6px 0 10px}}
  @media (prefers-reduced-motion:reduce){#tip{transition:none}}
  .chip{padding:2px 10px;border-radius:999px;background:#262b36;font-size:12px}
  .chip.run{background:#3a2f12;color:#f5c542}.chip.done{background:#123a26;color:#3ecf8e}
  #rounds{display:flex;gap:4px}
  #rounds span{width:26px;height:6px;border-radius:3px;background:#262b36}
  #rounds span.on{background:#f5c542}#rounds span.past{background:#3ecf8e}
  #top .sp{flex:1}
  button{font:inherit;min-height:32px;border:1px solid #333a49;border-radius:8px;background:#1f2430;color:#e8eaf0;padding:0 12px;cursor:pointer}
  button:hover{background:#2a3040}button:focus-visible{outline:2px solid #8ab4ff;outline-offset:2px}
  #main{display:grid;grid-template-columns:1fr 330px;min-height:0}
  #view{overflow:auto;position:relative;background:#0f1115}
  #stage{position:relative;zoom:var(--z,.5);background:var(--dc-bg);color:var(--dc-ink);font-family:var(--dc-font);font-size:var(--dc-text-base);line-height:var(--dc-leading);min-height:400px}
  #stage *{box-sizing:border-box}
  .host{position:relative;min-height:56px}
  .host.editing{box-shadow:inset 0 0 0 4px var(--c);transition:box-shadow .2s}
  .host .scan{position:absolute;left:0;right:0;height:3px;background:var(--c);box-shadow:0 0 18px 4px var(--c);pointer-events:none;z-index:5}
  .stub{display:grid;place-items:center;min-height:120px;color:var(--dc-muted);font-size:13px}
  #cursors{position:absolute;inset:0;pointer-events:none;z-index:60}
  .cursor{position:absolute;left:0;top:0;transition:left .45s cubic-bezier(.2,.7,.2,1),top .45s cubic-bezier(.2,.7,.2,1),opacity .4s;opacity:0}
  .cursor.live{opacity:1}
  .cursor .in{transform:scale(var(--inv,2));transform-origin:0 0;display:flex;align-items:flex-start;gap:2px}
  .cursor svg{width:18px;height:22px;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
  .cursor .who{margin-top:10px}
  .cursor .act{display:block;margin-top:2px;max-width:230px;padding:1px 7px;border-radius:5px;background:rgba(0,0,0,.72);color:#fff;font:11px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cursor .act:empty{display:none}
  .cursor .name{display:inline-block;padding:2px 8px;border-radius:6px;color:#fff;font:700 12px/1.5 system-ui,sans-serif;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.35)}
  .cursor .bub{display:none;margin-top:4px;max-width:230px;padding:6px 9px;border-radius:8px;border-left:4px solid var(--c);background:#fff;color:#1a1d24;font:12px/1.4 system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .cursor.talk .bub{display:block}
  body.nobub .cursor .bub{display:none!important}
  aside{display:flex;flex-direction:column;min-height:0;border-left:1px solid #262b36;background:#13161c}
  #agents{overflow:auto;padding:8px;display:grid;gap:6px;flex:1 1 55%}
  .card{border:1px solid #262b36;border-left:4px solid var(--c);border-radius:10px;padding:7px 10px;background:#171a21;cursor:pointer}
  .card:hover{background:#1d212b}
  .card .h{display:flex;gap:8px;align-items:center}
  .card b{font-size:13px}.card .sec{color:#8b93a7;font-size:12px}
  .card .st{margin-left:auto;font-size:11px;padding:1px 8px;border-radius:999px;background:#262b36}
  .card .st.working{background:#3a2f12;color:#f5c542}.card .st.done{background:#123a26;color:#3ecf8e}.card .st.failed{background:#4a1d1d;color:#ff8a80}
  .card .th{margin:4px 0 0;color:#c4c9d6;font-size:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card .ac{color:#8b93a7;font-size:11px;margin-top:2px}
  #feed{flex:1 1 45%;overflow:auto;border-top:1px solid #262b36;padding:8px 10px;font-size:12px;color:#aab0bf;list-style:none;margin:0}
  #feed li{padding:2px 0;border-bottom:1px solid #1d212b}
  #feed .t{color:#6f778a;margin-right:6px}#feed .mgr{color:#8ab4ff}
  #tabs{display:flex;border-bottom:1px solid #262b36;background:#171a21}
  #tabs button{flex:1;border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;min-height:40px;color:#8b93a7}
  #tabs button[aria-selected=true]{color:#e8eaf0;border-bottom-color:#8ab4ff}
  #tabs .dot{display:none;width:7px;height:7px;border-radius:50%;background:#ff6b5e;margin-left:6px;vertical-align:middle}
  #tabs .dot.on{display:inline-block}
  .pane{display:none;flex:1;min-height:0;flex-direction:column}.pane.on{display:flex}
  #chan,#docs{flex:1;min-height:0;overflow:auto}
  #pane-team{overflow:hidden}
  body[data-chat=off] #main{grid-template-columns:1fr}
  body[data-chat=off] aside{display:none}
  @media (max-width:760px){#main{grid-template-columns:1fr}aside{display:none}
    body[data-chat=on] aside{display:flex;position:fixed;left:0;right:0;top:44px;bottom:0;z-index:200;border-left:0}}
  @media (prefers-reduced-motion:reduce){.cursor{transition:none}}
</style>
</head>
<body>
<header id="top">
  <h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 7l3 3M17 7l-3 3M7 17l3-3M17 17l-3-3"/></svg><span>Swarm</span></h1>
  <span class="chip" id="phase" data-tip-title="Status" data-tip="Whether the team is idle, ready for a request, or working on one.">connecting</span>
  <div id="rounds" aria-label="rounds"></div><span class="chip" id="rtxt" data-tip-title="Round" data-tip="The step the team is on, for example build or improve together."></span>
  <span class="chip" id="model" data-tip-title="Model" data-tip="The AI model and reasoning effort the agents use. Change it in Settings."></span>
  <span class="sp"></span>
  <button class="ibtn" id="pick" type="button" aria-pressed="false" aria-label="Pick an element" data-tip-title="Pick an element" data-tip="Click any part of the page to ask the agent who owns that section to change it, or to explain why it is designed that way."></button>
  <button class="ibtn" id="setbtn" type="button" aria-haspopup="dialog" aria-label="Settings" data-tip-title="Settings" data-tip="Choose which CLI runs the agents (codex or pi), the model and the reasoning effort. Changes apply from the next agent turn."></button>
  <button class="ibtn" id="lookbtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Appearance" data-tip-title="Appearance" data-tip="Preview the page in light or dark, in another brand colour theme, or in another language. This changes only your preview."></button>
  <button class="ibtn" id="zoom" type="button" aria-label="Zoom" data-tip-title="Zoom" data-tip="Switch between overview, which shows the whole page and every cursor, and 100 percent, the real size."></button>
  <button class="ibtn" id="bub" type="button" aria-pressed="true" aria-label="Thoughts" data-tip-title="Thought bubbles" data-tip="Show or hide the speech bubbles next to each agent's cursor."></button>
  <button class="ibtn" id="panel" type="button" aria-pressed="true" aria-label="Chat panel" data-tip-title="Chat panel" data-tip="Show or hide the right side panel with the channel, team and documents."><span class="badge" id="unread"></span></button>
</header>
<div id="look" role="dialog" aria-label="Appearance" hidden>
  <div class="lg"><b>Theme</b><span><button type="button" data-sds-theme="auto">Auto</button><button type="button" data-sds-theme="light">Light</button><button type="button" data-sds-theme="dark">Dark</button></span></div>
  <div class="lg"><b>Brand</b><span><button type="button" data-sds-brand="none">None</button><button type="button" data-sds-brand="forest-gold">Forest gold</button><button type="button" data-sds-brand="gjh-classic">GJH classic</button></span></div>
  <div class="lg"><b>Language</b><span><button type="button" data-sds-lang="en">English</button><button type="button" data-sds-lang="zh-Hans">简体中文</button><button type="button" data-sds-lang="ms">Melayu</button></span></div>
  <p>Preview only. Sections show a theme or language once they use SDS tokens and <code>data-i18n</code>.</p>
</div>
<div id="pickbox" hidden><span></span></div>
<form id="askpop" role="dialog" aria-label="Ask about this element" hidden>
  <div class="ah"><i></i><b></b><button type="button" class="ibtn" id="askx" aria-label="Cancel"></button></div>
  <div class="ae"></div>
  <textarea id="asktext" rows="3" maxlength="400" placeholder="Describe the change, or ask a question"></textarea>
  <div class="ab"><button type="submit" id="askchange" class="pri">Ask to change</button><button type="button" id="askwhy">Explain why</button></div>
</form>
<div id="setdlg" role="dialog" aria-modal="true" aria-label="Settings" hidden>
  <div class="sheet"><header><b>Settings</b><button class="ibtn" id="setclose" type="button" aria-label="Close settings"></button></header><div id="setroot"></div></div>
</div>
<div id="main">
  <div id="view"><div id="stage"><div id="page"></div><div id="cursors"></div></div></div>
  <aside>
    <div id="tabs" role="tablist"><button role="tab" data-t="chan" aria-selected="true" data-tip-title="Channel" data-tip="Group chat with the Manager and every agent. Type here to give the team a request.">Channel<span class="dot" id="d-chan"></span></button><button role="tab" data-t="team" aria-selected="false" data-tip-title="Team" data-tip="Each agent's section, status and latest thought.">Team</button><button role="tab" data-t="docs" aria-selected="false" data-tip-title="Documents" data-tip="The Manager's direction, decisions and reviews.">Docs<span class="dot" id="d-docs"></span></button></div>
    <div class="pane on" id="pane-chan"><div id="chan"></div></div>
    <div class="pane" id="pane-team"><div id="agents"></div><ul id="feed" aria-live="polite"></ul></div>
    <div class="pane" id="pane-docs"><div id="docs"></div></div>
  </aside>
</div>
<script src="/ds/runtime.js"></script>
<script src="/ds/i18n.js"></script>
<script src="/channel.js"></script>
<script src="/settings.js"></script>
<script src="/docs.js"></script>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  var stage = $('stage'), page = $('page'), layer = $('cursors'), view = $('view');
  var linksSvg = null, S = null, hosts = {}, cur = {}, cards = {}, hash = {}, seed = {}, zoom = 0.5, order = [];

  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function hh(s) { var x = 0; for (var i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) | 0; return x; }
  function fetchText(u) { return fetch(u + '?_=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).catch(function () { return ''; }); }
  function setZoom(z) { zoom = z; stage.style.setProperty('--z', z); stage.style.setProperty('--inv', 1 / z); paintZoom(); placeAll(); }

  function build(state) {
    S = state; page.innerHTML = ''; layer.innerHTML = ''; linksSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); linksSvg.setAttribute('class', 'links'); layer.appendChild(linksSvg); $('agents').innerHTML = '';
    hosts = {}; cur = {}; cards = {}; hash = {}; order = Object.keys(S.agents).sort();
    order.forEach(function (id, i) {
      var a = S.agents[id], d = document.createElement('div');
      if (a.section) {
        d.className = 'host'; d.id = 'host-' + id; d.style.setProperty('--c', a.color);
        d.innerHTML = '<div class="stub">' + a.name + ' &middot; ' + a.section + '</div><style></style><div class="body"></div>';
        page.appendChild(d); hosts[id] = { el: d, timer: 0 };
      }
      var c = document.createElement('div'); c.className = 'cursor'; c.style.setProperty('--c', a.color);
      c.innerHTML = '<div class="in"><svg viewBox="0 0 18 22"><path d="M1 1l15 8-6.5 1.8L7 17z" fill="' + a.color + '" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg><div class="who"><span class="name" style="background:' + a.color + '">' + a.name + '</span><span class="act"></span><div class="bub"></div></div></div>';
      layer.appendChild(c); cur[id] = { el: c, t: 0 }; seed[id] = i * 7;
      var k = document.createElement('div'); k.className = 'card'; k.style.setProperty('--c', a.color);
      k.innerHTML = '<div class="h"><b>' + a.name + '</b><span class="sec">' + a.section + '</span><span class="st">queued</span></div><div class="th"></div><div class="ac"></div>';
      k.onclick = function () { hosts[id].el.scrollIntoView({ behavior: 'smooth', block: 'start' }); pulse(id); };
      $('agents').appendChild(k); cards[id] = k;
      refreshCard(id);
      if (a.section) load(id, false);
    });
    $('model').textContent = S.model;
    setPhase();
    initPanels();
    (S.feed || []).slice(-40).forEach(function (e) { feed(e, true); });
    setTimeout(placeAll, 300);
  }

  function setPhase() {
    var p = $('phase'); p.textContent = S.phase; p.className = 'chip ' + (S.phase === 'running' ? 'run' : S.phase === 'done' ? 'done' : '');
    var r = $('rounds'); r.innerHTML = '';
    for (var i = 1; i <= S.rounds; i++) { var s = document.createElement('span'); s.className = i < S.round || S.phase === 'done' ? 'past' : i === S.round ? 'on' : ''; r.appendChild(s); }
    $('rtxt').textContent = S.round ? 'round ' + S.round + '/' + S.rounds + ' ' + ['', 'build', 'improve together', 'apply suggestions'][S.round] : 'not started';
  }

  function refreshCard(id) {
    var a = S.agents[id], k = cards[id], st = k.querySelector('.st'), w = (a.status || '').split(' ')[0];
    st.textContent = a.status; st.className = 'st ' + w;
    k.querySelector('.th').textContent = a.thought || '';
    k.querySelector('.ac').textContent = a.action ? a.action : '';
    cur[id].working = (w === 'working');
    sweepLive();
  }
  // A cursor is visible only while its agent is really working or did something in the last 6 s (no idle ghosts).
  function touch(id, ms) { if (cur[id]) { cur[id].until = Date.now() + (ms || 6000); sweepLive(); } }
  function sweepLive() { var now = Date.now(); Object.keys(cur).forEach(function (id) { var c = cur[id]; c.el.classList.toggle('live', !!c.working || (c.until || 0) > now); }); }
  setInterval(sweepLive, 1000);
  function actText(e) {
    var cmd = String(e.cmd || '');
    var m = /(?:sections|notes|discussion|chat|inbox)\/[\w.\-]+|[\w\-]+\.(?:md|html|css|jsonl|json|js)\b/.exec(cmd);
    if (m) return e.verb + ' ' + m[0];
    return 'running ' + cmd.replace(/^["']+|["']+$/g, '').replace(/\s+/g, ' ').slice(0, 26);
  }
  function setAct(id, text) { var el = cur[id] && cur[id].el.querySelector('.act'); if (el) { el.textContent = text || ''; el.title = text || ''; } }

  function load(id, animate) {
    var a = S.agents[id], base = '/p/sections/' + id + '-' + a.section;
    return Promise.all([fetchText(base + '.html'), fetchText(base + '.css')]).then(function (r) {
      var h = hh(r[0] + '|' + r[1]); if (hash[id] === h) return; hash[id] = h;
      var el = hosts[id].el, filled = r[0].trim().length > 60;
      var prevHtml = el.querySelector('.body').innerHTML, prevCss = el.querySelector('style').textContent;
      el.querySelector('.stub').style.display = filled ? 'none' : '';
      el.querySelector('.body').innerHTML = r[0]; el.querySelector('style').textContent = r[1];
      if (animate && filled) wipe(id);
      placeAll();
      if (animate && filled && (prevHtml.trim() || prevCss.trim())) visitChanges(id, changedElements(el, prevHtml, r[0], prevCss, r[1]));
    });
  }

  // ---- real change detection: compare the previous and the new fragment and find the elements that differ
  function changedElements(host, prevHtml, newHtml, prevCss, newCss) {

    function fill(el) { var t = el.getAttribute('data-tip-title'), d = el.getAttribute('data-tip'); tip.textContent = ''; if (t) { var b = document.createElement('b'); b.textContent = t; tip.appendChild(b); } var sp = document.createElement('span'); sp.textContent = d || ''; tip.appendChild(sp); }
    function place(x, y) { var w = tip.offsetWidth, h = tip.offsetHeight, nx = x + 14, ny = y + 20; if (nx + w > innerWidth - 8) nx = x - w - 14; if (nx < 8) nx = 8; if (ny + h > innerHeight - 8) ny = y - h - 14; if (ny < 8) ny = 8; tip.style.transform = 'translate(' + Math.round(nx) + 'px,' + Math.round(ny) + 'px)'; }

    document.addEventListener('pointerover', function (e) { if (e.pointerType === 'touch') return; var el = e.target.closest && e.target.closest('[data-tip]'); if (!el) return; cur = el; fill(el); tip.classList.add('on'); place(e.clientX, e.clientY); });
    document.addEventListener('pointermove', function (e) { if (cur) place(e.clientX, e.clientY); });
    document.addEventListener('pointerout', function (e) { if (cur && !(e.relatedTarget && cur.contains(e.relatedTarget))) hide(); });
    document.addEventListener('pointerdown', hide);
    document.addEventListener('focusin', function (e) { var el = e.target.closest && e.target.closest('[data-tip]'); if (!el || !el.matches(':focus-visible')) return; cur = el; fill(el); tip.classList.add('on'); var r = el.getBoundingClientRect(); place(r.left, r.bottom); });
    document.addEventListener('focusout', hide);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hide(); });
  })();

  var es = new EventSource('/events');
  es.onmessage = function (m) { onEvent(JSON.parse(m.data)); };
  es.onerror = function () { $('phase').textContent = 'reconnecting'; };
})();
