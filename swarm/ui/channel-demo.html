<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Swarm channel demo</title>
  <link rel="stylesheet" href="./channel.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: #0f1115;
      color: #e8eaf0;
      color-scheme: dark;
      font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    }
    main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: min(100%, var(--demo-width, 329px));
      min-width: 0;
      height: 100vh;
      height: 100dvh;
      outline: 1px solid #262b36;
      background: #13161c;
    }
    header {
      display: grid;
      gap: 6px;
      padding: 9px 8px;
      border-bottom: 1px solid #262b36;
      background: #171a21;
    }
    h1 { margin: 0; font-size: 14px; font-weight: 675; }
    .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
    .controls label { display: flex; align-items: center; gap: 4px; color: #aab2c4; }
    .controls :is(button, select) {
      min-height: 28px;
      padding: 3px 7px;
      border: 1px solid #333a49;
      border-radius: 6px;
      background: #1f2430;
      color: #e8eaf0;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .controls :is(button, select):hover { background: #2a3040; }
    .controls button:disabled { opacity: .6; cursor: default; }
    .controls :focus-visible { outline: 2px solid #8ab4ff; outline-offset: 2px; }
    #selected { color: #aab2c4; font-size: 12px; }
    #channel { min-width: 0; min-height: 0; }
    @media (min-width: 760px) {
      main { height: min(860px, 94vh); border-radius: 10px; overflow: clip; }
    }
    @media (max-width: 760px), (pointer: coarse) {
      .controls :is(button, select) { min-height: 40px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Swarm channel demo</h1>
      <div class="controls">
        <label>Width
          <select id="width">
            <option value="329">329 px</option>
            <option value="393">393 px</option>
            <option value="360">360 px</option>
          </select>
        </label>
        <button type="button" id="load">Load 1,500</button>
        <button type="button" id="replay">Replay</button>
      </div>
      <div id="selected" role="status" hidden></div>
    </header>
    <div id="channel"></div>
  </main>
  <script src="./channel.js"></script>
  <script>
    (function () {
      'use strict';

      const sections = ['Hero', 'Navigation', 'Features', 'Testimonials', 'Pricing',
        'FAQ', 'Contact', 'Footer', 'Accessibility', 'Responsive'];
      const colors = ['#a6c6ff', '#61dcb5', '#f4bb73', '#d3adff', '#f69dba',
        '#7ed9f4', '#d3da7f', '#f5aa96', '#a3baff', '#a8dfa2'];
      const workers = sections.map((section, i) => ({
        id: String(i + 1).padStart(2, '0'), name: 'Agent ' + (i + 1),
        section, color: colors[i]
      }));
      const agents = [{ id: '00', name: 'Manager', section: 'Direction', color: '#f4f4f5' }].concat(workers);
      const longNote = ('窄屏测试记录。' + ('先确认手机上的导航、焦点顺序和按钮间距。打开菜单后，页面标题仍应清楚可读。' +
        '长段落会在窄屏上换行，中文标点应尽量留在上一行。完成测试后，请记录复现步骤和截图。').repeat(10)).slice(0, 600);
      const script = [
        ['owner', 'msg', '@Manager 请协调最后一轮检查。优先看手机上的导航、版面和键盘操作。', ['00']],
        ['system', 'system', 'Triage started'],
        ['00', 'msg', '先核对 329 px 侧栏和两个手机宽度。'],
        ['00', 'assign', 'First-screen review.', ['03'], '校对首屏标题，确认菜单打开时依然可读。'],
        ['00', 'assign', 'Check keyboard paths.', ['02', '09'], 'Verify menu focus and the return path.'],
        ['system', 'system', 'Discuss started'],
        ['03', 'msg', '@Agent 2 我会先用 360 px 检查标题和首屏留白。', ['02']],
        ['03', 'msg', '也会留一张 393 px 的图，方便对照。'],
        ['02', 'msg', '@hero The menu stays visible at 329 px.', ['01']],
        ['claude', 'msg', 'I’ll review the keyboard path when the three widths are ready.'],
        ['06', 'msg', 'Wrap check ' + 'LongUnbrokenString'.repeat(22)],
        ['09', 'msg', 'Keyboard checklist\n1. Open\n2. Tab\n3. Next\n4. Back\n5. Escape\n6. Return\n7. Repeat'],
        ...Array.from({ length: 40 }, () => ['system', 'system', 'Malformed outbox line']),
        ['system', 'system', 'Decide started'],
        ['00', 'decision', '@everyone Keep the compact menu. Verify focus return and capture all three widths.', workers.map(agent => agent.id)],
        ['system', 'system', 'Work started'],
        ['03', 'msg', longNote],
        ['03', 'msg', '下一步我会把截图发给 @Manager。', ['00']],
        ['02', 'done', 'Verified the menu at 329 px and 393 px.', ['owner']],
        ['09', 'done', '键盘焦点已验证，按 Esc 后回到菜单按钮。', ['claude']],
        ['system', 'system', 'Summary started'],
        ['00', 'msg', 'Ready for launch review. @everyone Thanks for checking all three widths.', workers.map(agent => agent.id)]
      ];
      const start = Date.now() - script.length * 18000;
      const history = script.map(([from, kind, text, to = [], task], i) => ({
        id: i + 1, ts: start + i * 18000, from, kind, text, to, task
      }));
      const channel = window.SwarmChannel;
      const width = document.getElementById('width');
      const replay = document.getElementById('replay');
      const load = document.getElementById('load');
      const selected = document.getElementById('selected');
      let id = history.length;
      let loaded = false;

      function post(from, kind, text) {
        channel.add({ id: ++id, ts: Date.now(), from, kind, text, to: [] });
      }

      function setWorking(ids) {
        agents.forEach(agent => channel.setStatus(agent.id, ids.includes(agent.id) ? 'working · Demo' : 'idle'));
      }

      function lockControls() {
        replay.disabled = true;
        load.disabled = true;
        channel.setBusy(true);
      }

      function finish() {
        channel.setBusy(false);
        setWorking([]);
        replay.disabled = false;
        load.disabled = loaded;
      }

      channel.init({
        root: document.getElementById('channel'),
        agents,
        send(text) {
          post('owner', 'msg', text);
          lockControls();
          setWorking(['00', '03', '09']);
          window.setTimeout(() => {
            post('00', 'msg', 'I’ve added your note to the demo conversation.');
            finish();
          }, 1800);
        },
        onJump(agentId) {
          const agent = agents.find(item => item.id === agentId);
          selected.hidden = false;
          selected.textContent = agent ? agent.name + ' · ' + agent.section :
            'Selected ' + (agentId === 'owner' ? 'Owner' : 'Claude');
        }
      });
      channel.setHistory(history);

      function setWidth() {
        document.querySelector('main').style.setProperty('--demo-width', width.value + 'px');
      }
      width.addEventListener('change', setWidth);
      setWidth();

      load.addEventListener('click', () => {
        const timestamp = Date.now() - 15000;
        const updates = [
          'Checked the narrow layout and saved the result.',
          '手机宽度已复核，菜单可以用键盘打开。',
          'Confirmed the follow-up with @Manager.'
        ];
        for (let i = 0; i < 1500; i += 1) {
          channel.add({
            id: ++id, ts: timestamp + i * 10, from: workers[Math.floor(i / 3) % workers.length].id,
            kind: i % 17 === 0 ? 'done' : 'msg',
            text: 'Update ' + (i + 1) + ' · ' + updates[i % updates.length],
            to: i % updates.length === 2 ? ['00'] : []
          });
        }
        loaded = true;
        load.disabled = true;
      });

      replay.addEventListener('click', () => {
        loaded = false;
        id = history.length;
        lockControls();
        setWorking(['00']);
        channel.setHistory([]);
        let index = 0;
        const timer = window.setInterval(() => {
          const msg = history[index++];
          if (msg.text === 'Work started') setWorking(['02', '03', '09']);
          if (msg.kind === 'done') channel.setStatus(msg.from, 'done');
          channel.add(msg);
          if (index === history.length) {
            window.clearInterval(timer);
            finish();
          }
        }, 85);
      });
    }());
  </script>
</body>
</html>
