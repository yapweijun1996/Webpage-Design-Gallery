<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swarm channel demo</title>
  <link rel="stylesheet" href="./channel.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 0;
      background: #0f1115;
      color: #e8eaf0;
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    }
    main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: min(100%, 480px);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      border: 1px solid #262b36;
      background: #13161c;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 12px;
      padding: 10px 12px;
      border-bottom: 1px solid #262b36;
      background: #171a21;
    }
    h1 { flex: 1; margin: 0; font-size: 14px; }
    #replay {
      min-height: 32px;
      padding: 4px 10px;
      border: 1px solid #333a49;
      border-radius: 8px;
      background: #1f2430;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    #replay:hover { background: #2a3040; }
    #replay:disabled { opacity: .55; cursor: default; }
    #replay:focus-visible { outline: 2px solid #8ab4ff; outline-offset: 2px; }
    #selected { flex-basis: 100%; color: #aab0bf; font-size: 12px; }
    #channel { min-width: 0; min-height: 0; }
    @media (min-width: 520px) {
      main { height: min(780px, 94vh); border-radius: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Swarm · team channel</h1>
      <button type="button" id="replay">Replay conversation</button>
      <div id="selected" role="status" hidden></div>
    </header>
    <div id="channel"></div>
  </main>
  <script src="./channel.js"></script>
  <script>
    (function () {
      'use strict';

      const sections = ['Hero', 'Navigation', 'Features', 'Testimonials', 'Pricing',
        'FAQ', 'Contact', 'Footer', 'Accessibility', 'Responsive'];
      const colors = ['#a6c6ff', '#61dcb5', '#f4bb73', '#d3adff', '#f69dba',
        '#7ed9f4', '#d3da7f', '#f5aa96', '#a3baff', '#a8dfa2'];
      const workers = sections.map((section, i) => ({
        id: String(i + 1).padStart(2, '0'), name: 'Agent ' + (i + 1),
        section, color: colors[i]
      }));
      const agents = [{ id: '00', name: 'Manager', section: 'Direction', color: '#f4f4f5' }].concat(workers);
      const script = [
        ['owner', 'msg', 'The launch page needs a final pass at phone width. @Manager, can you coordinate the handoffs?', ['00']],
        ['system', 'system', 'Triage started'],
        ['00', 'msg', 'Let’s keep the launch story and make the small-screen path easier to follow.'],
        ['00', 'assign', 'Own the first screen.', ['01', '02'], 'Align the hero headline with the compact navigation.'],
        ['00', 'assign', 'Review the path from proof to pricing.', ['03', '04', '05'], 'Keep feature and testimonial cards readable and carry the primary action into pricing.'],
        ['00', 'assign', 'Check the rest of the page and report back.', ['06', '07', '08', '09', '10'], 'Verify disclosure labels, contact, footer links, keyboard focus, and narrow widths.'],
        ['system', 'system', 'Discuss started'],
        ['01', 'msg', '@2 I’ll keep the headline to two lines if the nav stays compact.', ['02']],
        ['02', 'msg', '@hero Agreed. I’ll keep the menu button visible at 330px.', ['01']],
        ['03', 'msg', '@Agent 4 I’ll match your card spacing.', ['04']],
        ['04', 'msg', '@agent5 I’ll keep the two shortest quotes ahead of pricing.', ['05']],
        ['05', 'msg', '@FAQ Please keep billing questions next to the plans.', ['06']],
        ['06', 'msg', 'Billing questions can open with the keyboard.'],
        ['07', 'msg', '@08 The contact link will point to the form heading.', ['08']],
        ['08', 'msg', 'I’ll preserve the same link order in the footer.'],
        ['09', 'msg', '@10 Flag any clipped focus rings during your width check.', ['10']],
        ['10', 'msg', 'I’ll test 330px and 393px with the menu open.'],
        ['system', 'system', 'Decide started'],
        ['00', 'decision', '@everyone Use the compact nav, maintain equal card spacing, and keep pricing beside its billing FAQ.', workers.map(agent => agent.id)],
        ['system', 'system', 'Work started'],
        ['01', 'done', 'Tightened the first-screen copy.'],
        ['02', 'done', 'Kept the menu button visible at 330px.'],
        ['03', 'done', 'Aligned the feature cards with the quote grid.'],
        ['04', 'done', 'Moved the two shortest quotes before pricing.'],
        ['05', 'done', 'Kept the primary action visible for every plan.'],
        ['06', 'done', 'Moved billing questions under the plans.'],
        ['07', 'done', 'Linked contact to the form heading.'],
        ['08', 'done', 'Aligned footer and header link order.'],
        ['09', 'done', 'Verified keyboard order and focus visibility.'],
        ['10', 'done', 'Checked the open menu at 330px and 393px.'],
        ['system', 'system', 'Summary started'],
        ['00', 'msg', 'The page is ready for the launch review. The team verified the menu and keyboard path at both phone widths.']
      ];
      const start = new Date().setHours(9, 30, 0, 0);
      const history = script.map(([from, kind, text, to = [], task], i) => ({
        id: i + 1, ts: start + i * 40000, from, kind, text, to, task
      }));
      const channel = window.SwarmChannel;
      const replay = document.getElementById('replay');
      const selected = document.getElementById('selected');
      let id = history.length;

      function post(from, kind, text) {
        channel.add({ id: ++id, ts: Date.now(), from, kind, text, to: [] });
      }

      function setWorking(ids) {
        agents.forEach(agent => channel.setStatus(agent.id, ids.includes(agent.id) ? 'working · Demo' : 'idle'));
      }

      function finish() {
        setWorking([]);
        channel.setBusy(false);
        replay.disabled = false;
      }

      channel.init({
        root: document.getElementById('channel'),
        agents,
        send(text) {
          replay.disabled = true;
          post('owner', 'msg', text);
          setWorking(['00']);
          channel.setBusy(true);
          window.setTimeout(() => {
            post('00', 'msg', 'I’ve added your note to the demo conversation.');
            finish();
          }, 1000);
        },
        onJump(agentId) {
          const agent = agents.find(item => item.id === agentId);
          selected.hidden = false;
          selected.textContent = agent ? agent.name + ' · ' + agent.section : 'Selected ' + agentId;
        }
      });
      channel.setHistory(history);

      replay.addEventListener('click', () => {
        replay.disabled = true;
        channel.setBusy(true);
        channel.setHistory([]);
        let index = 0;
        const timer = window.setInterval(() => {
          const msg = history[index++];
          if (msg.text === 'Discuss started' || msg.text === 'Work started') {
            setWorking(workers.map(agent => agent.id));
          }
          if (msg.text === 'Triage started' || msg.text === 'Decide started' ||
              msg.text === 'Summary started') setWorking(['00']);
          if (msg.kind === 'done') channel.setStatus(msg.from, 'done');
          channel.add(msg);
          if (index === history.length) {
            window.clearInterval(timer);
            finish();
          }
        }, 400);
      });
    }());
  </script>
</body>
</html>
