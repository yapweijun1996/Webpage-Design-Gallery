name: Deploy demo to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare demo
        run: |
          mkdir -p _site/demos/corporate/gjh/v1/assets
          cp index.html _site/index.html
          cp demos/corporate/gjh/v1/{index.html,style.css,script.js} _site/demos/corporate/gjh/v1/
          cp demos/corporate/gjh/v1/assets/{hero.webp,thumbnail.webp} _site/demos/corporate/gjh/v1/assets/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
