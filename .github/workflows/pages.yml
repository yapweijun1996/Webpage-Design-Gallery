name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check design system
        run: python scripts/check_ssot.py
      - name: Check generated gallery
        run: python scripts/build_gallery.py --check
      - name: Build company gallery
        run: python scripts/build_gallery.py --output _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Wait for Pages artifact registration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stable=0
          for attempt in {1..30}; do
            count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' 2>/dev/null || true)"
            if [[ "$count" == "1" ]]; then
              stable=$((stable + 1))
              if (( stable >= 3 )); then exit 0; fi
            else
              stable=0
              if [[ "$count" =~ ^[0-9]+$ ]] && (( count > 1 )); then
                echo "::error::Multiple Pages artifacts were registered for this run."
                exit 1
              fi
            fi
            sleep 2
          done
          echo "::error::Pages artifact registration did not become available."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
