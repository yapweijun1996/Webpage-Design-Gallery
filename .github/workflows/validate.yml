name: Validate gallery and mall

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Check design system and generated files
        run: |
          python scripts/check_ssot.py
          python scripts/build_gallery.py --check
      - name: Test design system and gallery contracts
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test mall state and spatial contracts
        run: node --test tests/gjh_*.test.mjs
