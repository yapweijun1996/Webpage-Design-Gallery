<!doctype html>
<html lang="en-SG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GJH v20 Direction B comparison</title>
  <style>
    body { margin: 24px auto; width: min(94%, 1480px); font: 16px/1.45 system-ui, sans-serif; color: #101f34; background: #f7fafc; }
    .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }
    figure { margin: 0; padding: 12px; background: #fff; border: 1px solid #6f829b; }
    figcaption { margin-bottom: 8px; font-weight: 700; }
    img, object { display: block; width: 100%; height: auto; }
    .phone { max-width: 800px; }
  </style>
</head>
<body>
  <main>
    <h1>GJH v20 · Direction B</h1>
    <p>The live captures appear here after the v20 landing check runs with <code>--capture</code>.</p>
    <section aria-labelledby="desktop">
      <h2 id="desktop">Desktop · 1440px</h2>
      <div class="pair">
        <figure>
          <figcaption>Mockup (proposal)</figcaption>
          <img src="mockups/B-desktop-1440.png" alt="Direction B desktop design proposal" width="1440" height="2741">
        </figure>
        <figure>
          <figcaption>Screenshot (real)</figcaption>
          <object type="image/png" data="../../demos/corporate/gjh/v20/screenshots/1440.png" aria-label="GJH v20 desktop browser capture">
            <p>Awaiting browser capture.</p>
          </object>
        </figure>
      </div>
    </section>
    <section class="phone" aria-labelledby="mobile">
      <h2 id="mobile">Mobile · 390px</h2>
      <div class="pair">
        <figure>
          <figcaption>Mockup (proposal)</figcaption>
          <img src="mockups/B-mobile-390.png" alt="Direction B mobile design proposal" width="390" height="3210">
        </figure>
        <figure>
          <figcaption>Screenshot (real)</figcaption>
          <object type="image/png" data="../../demos/corporate/gjh/v20/screenshots/390.png" aria-label="GJH v20 mobile browser capture">
            <p>Awaiting browser capture.</p>
          </object>
        </figure>
      </div>
    </section>
  </main>
</body>
</html>
