<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-labelledby="t d"><title id="t">Field Sketchbook: pottery observation sheet</title><desc id="d">Three spaces for sketching the silhouette, drawing a detail, and recording one question.</desc><defs><pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".8" fill="#c7c8b7"/></pattern></defs><rect width="720" height="520" fill="#f8f6eb"/><rect x="18" y="18" width="684" height="484" fill="url(#dots)" stroke="#575c46"/><g font-family="monospace" fill="#394133"><text x="42" y="53" font-size="13" letter-spacing="2">THOW KWANG / STUDY SHEET</text><text x="42" y="102" font-family="Georgia,serif" font-size="40">Slow looking</text><text x="43" y="131" font-size="14">Date: __________________   Object: __________________</text><path d="M42 153H674 M365 169V366 M42 374H674 M42 444H674" fill="none" stroke="#7b806d"/><text x="43" y="180" font-size="14">01 / Sketch the outline</text><text x="380" y="180" font-size="14">02 / Enlarge a detail</text><text x="43" y="400" font-size="14">03 / Write one question</text><text x="43" y="478" font-size="12">Independent educational study sheet. Not an official programme.</text></g></svg>