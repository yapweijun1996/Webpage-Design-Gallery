<div id="page-loader" class="loader" hidden>
  <div class="loader__card" role="status" aria-live="polite" aria-labelledby="page-loader-title">
    <div class="loader__brand">
      {{loader-brand}}
      <p class="loader__tagline">{{t:loader.tagline}}</p>
    </div>
    <span class="loader__indicator" aria-hidden="true"></span>
    <p id="page-loader-title" class="loader__title">{{t:loader.pageTitle}}</p>
  </div>
</div>
